<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amka's Todolist</title>
    <link rel="stylesheet" href="./todolist.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <input placeholder="Write here to add..." />
        <button>add</button>
      </div>

      <div class="list">
        <div class="item">
          <input type="checkbox" />

          <p>wake up early</p>

          <button class="delete">delete</button>
        </div>
      </div>
    </div>

    <script src="./todolist.js"></script>
  </body>
</html>
